# Singapore. Mumbai would be nearer to the cinemas in this diary, but Fly has
# retired bom for new machines. sin costs less to serve from anyway: egress from
# Asia-Pacific is $0.04/GB against India's $0.12, for about 30ms more latency.
app = "reel-diary"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # A personal site with no visitors most of the day. The machine sleeps and
  # wakes on the next request, which costs a second or two of cold start and
  # almost nothing to run.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# No [mounts]. Phase one ships the database inside the image and never writes to
# it. A volume arrives with uploads, not before.
